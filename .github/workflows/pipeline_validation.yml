name: Pipeline Validation

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run flake8 linter
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ pipeline_run.py app.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat all other issues as warnings (non-blocking)
          flake8 src/ pipeline_run.py app.py --count --max-line-length=120 --max-complexity=15 --statistics --exit-zero

  validate:
    name: Pipeline Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full pipeline validation
        run: |
          python pipeline_run.py --validate --sample-size 1000 --seed 42

      - name: Verify output artifacts
        run: |
          echo "=== Checking generated files ==="
          ls -la data/raw/
          echo "---"
          ls -la data/processed/
          echo "---"
          ls -la docs/

          # Assert critical files exist
          test -f data/raw/google_ads_impressions.csv || (echo "FAIL: google_ads CSV missing" && exit 1)
          test -f data/raw/meta_ads_clicks.csv || (echo "FAIL: meta_ads CSV missing" && exit 1)
          test -f data/raw/platform_signups.json || (echo "FAIL: signups JSON missing" && exit 1)
          test -f data/raw/user_event_logs.csv || (echo "FAIL: events CSV missing" && exit 1)
          test -f data/processed/master_activated_campaigns.parquet || (echo "FAIL: campaign parquet missing" && exit 1)
          test -f data/processed/user_activation_details.parquet || (echo "FAIL: user parquet missing" && exit 1)
          test -f data/processed/activation_engine.db || (echo "FAIL: SQLite DB missing" && exit 1)
          test -f docs/data_dictionary.md || (echo "FAIL: data dictionary missing" && exit 1)

          echo "All output artifacts verified successfully!"

      - name: Verify zero join drops
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from src.ingestion import ingest_all_datasets
          from src.cleaning import clean_all_datasets
          from src.joining import join_all_datasets

          dfs, _ = ingest_all_datasets()
          cleaned = clean_all_datasets(dfs)
          master, audits = join_all_datasets(cleaned)

          total_warnings = sum(len(a.validate()) for a in audits)
          print(f'Join warnings: {total_warnings}')

          # Count unmatched keys
          total_unmatched = sum(a.unmatched_left_keys + a.unmatched_right_keys for a in audits)
          print(f'Unmatched keys: {total_unmatched}')

          if total_warnings > 0:
              print('FAIL: Join integrity check failed')
              sys.exit(1)
          else:
              print('PASS: Zero join drops confirmed')
          "

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            data/processed/*.parquet
            data/processed/*.db
            docs/data_dictionary.md
            logs/
          retention-days: 7
